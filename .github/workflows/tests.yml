name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Run every Python version to the end, so a failure shows whether it's version-specific.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ".[dev]"
      # The live test is skipped here: it needs a Canva login (CANVA_COOKIES and CANVA_URL).
      - run: pytest
